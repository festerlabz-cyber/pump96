name: Build Windows (VST3)

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - name: Configure (x64, MSVC, static runtime so no Visual C++ redistributable is needed)
        run: |
          cmake -S . -B build -A x64 \
            '-DCMAKE_MSVC_RUNTIME_LIBRARY=MultiThreaded$<$<CONFIG:Debug>:Debug>'

      - name: Build VST3
        run: cmake --build build --config Release --target Pump96_VST3 --parallel 4

      - name: Validate with pluginval
        run: |
          curl -sSL -o pluginval.zip https://github.com/Tracktion/pluginval/releases/latest/download/pluginval_Windows.zip
          7z x -y pluginval.zip > /dev/null
          ./pluginval.exe --strictness-level 5 --validate-in-process --timeout-ms 600000 \
            --output-dir pluginval-logs "build/Pump96_artefacts/Release/VST3/Pump 96.vst3"

      - name: Package
        run: |
          VERSION=$(grep -E "^project\(Pump96 VERSION" CMakeLists.txt | sed -E 's/.*VERSION ([0-9.]+).*/\1/')
          SHORT=$(git rev-parse --short HEAD)
          mkdir -p dist
          cp -R "build/Pump96_artefacts/Release/VST3/Pump 96.vst3" dist/
          cp packaging/LEESMIJ-Windows.txt dist/LEESMIJ.txt
          echo "ZIP_NAME=Pump96-Windows-VST3-$VERSION-$SHORT" >> "$GITHUB_ENV"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ZIP_NAME }}
          path: dist/
          retention-days: 30

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pluginval-logs
          path: pluginval-logs/
          retention-days: 7
          if-no-files-found: ignore
